name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # Cheap gates that don't need the SDK or Dalamud — run them first so a
  # version-sync mistake fails fast without burning the full build.
  guards:
    name: Guards (repo.json)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check repo.json against the plugin version
        shell: bash
        run: |
          build_ver=$(grep -oP '<Version>\K[\d.]+(?=</Version>)' Directory.Build.props)
          assembly_ver=$(jq -r '.[0].AssemblyVersion' repo.json)
          testing_ver=$(jq -r '.[0].TestingAssemblyVersion' repo.json)
          echo "Directory.Build.props <Version>      = $build_ver"
          echo "repo.json AssemblyVersion           = $assembly_ver"
          echo "repo.json TestingAssemblyVersion    = $testing_ver"
          if [ "$assembly_ver" != "$testing_ver" ]; then
            echo "::error::repo.json AssemblyVersion ($assembly_ver) and TestingAssemblyVersion ($testing_ver) must match."
            exit 1
          fi
          # repo.json may lag <Version> (release.yml catches it up once the zip is
          # published) but must never lead it: Dalamud would offer an update that isn't there.
          newest=$(printf '%s\n%s\n' "$build_ver" "$assembly_ver" | sort -V | tail -1)
          if [ "$newest" != "$build_ver" ]; then
            echo "::error::repo.json ($assembly_ver) is ahead of Directory.Build.props ($build_ver)."
            exit 1
          fi

  # Full build. Needs Dalamud present at the standard plugin path so
  # Dalamud.NET.Sdk can resolve $(DalamudLibPath).
  build:
    name: Build (Windows)
    needs: guards
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud dev build
        shell: pwsh
        run: |
          $dalamudUrl = "https://goatcorp.github.io/dalamud-distrib/latest.zip"
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri $dalamudUrl -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - name: Restore
        run: dotnet restore AutoFateGrind.sln

      - name: Build (Release)
        run: dotnet build AutoFateGrind.sln --configuration Release --no-restore

      - name: Find test projects
        id: find_tests
        shell: bash
        run: |
          if find . -name "*.Tests.csproj" -o -name "*.Test.csproj" 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.find_tests.outputs.found == 'true'
        run: dotnet test AutoFateGrind.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Dry-run the repo.json update
        shell: pwsh
        run: |
          Copy-Item repo.json repo.dryrun.json
          ./.github/scripts/update-repo-json.ps1 -Version '9.9.9.9' -ManifestPath AutoFateGrind/bin/Release/AutoFateGrind.json -DownloadCount 7 -Path repo.dryrun.json
          $raw = Get-Content -Raw repo.dryrun.json
          if (-not $raw.TrimStart().StartsWith('[')) { throw 'repo.json lost its array wrapper' }
          $entries = @($raw | ConvertFrom-Json)
          if ($entries.Count -ne 1) { throw "Expected 1 entry, got $($entries.Count)" }
          if ($entries[0].AssemblyVersion -ne '9.9.9.9' -or $entries[0].DownloadCount -ne 7) { throw 'repo.json fields were not updated' }
          if ($entries[0].InternalName -ne 'AutoFateGrind') { throw 'repo.json lost its other fields' }

      - name: Upload plugin artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: AutoFateGrind-plugin
          path: AutoFateGrind/bin/Release/AutoFateGrind/latest.zip
          if-no-files-found: warn
